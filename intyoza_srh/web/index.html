<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intyoza Health Chat</title>
<meta name="description" content="Private answers to questions about growing up, periods, relationships, contraception, pregnancy, STIs and HIV.">
<style>
  :root {
    --bg: #ffffff; --panel: #f7f8f7; --fg: #1d2421; --muted: #5b6662; --line: #e3e7e5;
    --brand: #13795b; --brand-fg: #ffffff; --brand-soft: #e6f3ee; --user: #eef1f0;
    --warn-bg: #fff6e8; --warn-line: #f0c27a; --chip: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.08);
    --fs: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171a19; --panel: #1f2321; --fg: #e9eeeb; --muted: #a3ada8; --line: #2e3431;
      --brand: #3fbf93; --brand-fg: #0c1512; --brand-soft: #1d2f28; --user: #262b29;
      --warn-bg: #2d261a; --warn-line: #8a6a32; --chip: #232826; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171a19; --panel: #1f2321; --fg: #e9eeeb; --muted: #a3ada8; --line: #2e3431;
    --brand: #3fbf93; --brand-fg: #0c1512; --brand-soft: #1d2f28; --user: #262b29;
    --warn-bg: #2d261a; --warn-line: #8a6a32; --chip: #232826; --shadow: none;
  }
  :root[data-contrast="high"] {
    --bg: #000; --panel: #000; --fg: #fff; --muted: #fff; --line: #fff; --brand: #ffd800; --brand-fg: #000;
    --brand-soft: #000; --user: #000; --warn-bg: #000; --warn-line: #ffd800; --chip: #000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: var(--fs)/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .app { display: flex; height: 100dvh; }

  /* sidebar */
  aside { width: 280px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side-head { padding: 14px; display: flex; gap: 8px; }
  .new-chat { flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .new-chat:hover { border-color: var(--brand); }
  .side-scroll { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .side-label { font-size: .75em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 6px 6px; }
  .topic { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
  .topic:hover, .topic[aria-expanded="true"] { background: var(--brand-soft); }
  .topic-qs { margin: 2px 0 6px 34px; display: none; }
  .topic-qs.open { display: block; }
  .topic-qs button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font-size: .88em; padding: 4px 6px; border-radius: 6px; }
  .topic-qs button:hover { color: var(--fg); background: var(--brand-soft); }
  .help { margin: 10px; padding: 12px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; font-size: .85em; }
  .help strong { display: block; margin-bottom: 4px; }
  .help a { color: inherit; font-weight: 600; }
  .settings { display: flex; gap: 6px; padding: 10px 14px 14px; flex-wrap: wrap; }
  .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: .85em; }
  .icon-btn[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); }

  /* main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.05em; margin: 0; flex: 1; }
  header .tag { font-size: .75em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .menu-btn { display: none; border: 0; background: none; padding: 6px; }
  #log { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
  .msg { display: flex; gap: 12px; margin: 0 0 22px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } #log { scroll-behavior: auto; } .dots span { animation: none !important; } }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9em; background: var(--brand); color: var(--brand-fg); }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user); border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot .body { flex: 1; min-width: 0; }
  .msg.bot .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot.safe .text { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; padding: 12px 14px; }
  .msg .title { font-weight: 650; margin-bottom: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; color: var(--muted); font-size: .8em; }
  .meta button { border: 0; background: none; color: var(--muted); padding: 2px 4px; border-radius: 6px; }
  .meta button:hover { color: var(--fg); background: var(--brand-soft); }
  .acc { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; border-radius: 999px; padding: 2px 10px;
         border: 1px solid currentColor; cursor: help; }
  .acc .bar { width: 46px; height: 6px; border-radius: 3px; background: color-mix(in srgb, currentColor 20%, transparent); overflow: hidden; }
  .acc .bar i { display: block; height: 100%; background: currentColor; }
  .acc.high { color: var(--brand); }
  .acc.mid { color: #b26b00; }
  .acc.low { color: #b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .acc.mid { color: #f0b54a; } :root:not([data-theme="light"]) .acc.low { color: #ff8a80; } }
  :root[data-theme="dark"] .acc.mid { color: #f0b54a; }
  :root[data-theme="dark"] .acc.low { color: #ff8a80; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: .88em; text-align: left; box-shadow: var(--shadow); }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chips-label { font-size: .8em; color: var(--muted); margin-top: 10px; }
  .dots { display: inline-flex; gap: 4px; padding: 8px 0; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .welcome { text-align: center; padding: 8vh 8px 16px; }
  .welcome .logo { width: 56px; height: 56px; margin: 0 auto 12px; font-size: 1.5em; }
  .welcome h2 { margin: 0 0 6px; font-size: 1.6em; }
  .welcome p { color: var(--muted); margin: 0 auto 22px; max-width: 30em; }
  .starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 640px; margin: 0 auto; }
  .starter { text-align: left; border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .starter:hover { border-color: var(--brand); }
  .starter small { display: block; color: var(--muted); }

  .composer { padding: 10px 16px 14px; }
  .box { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .box:focus-within { border-color: var(--brand); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--fg); font: inherit; max-height: 180px; padding: 6px 0; }
  .send { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; }
  .send:disabled { opacity: .4; cursor: default; }
  .foot { max-width: 760px; margin: 6px auto 0; text-align: center; font-size: .75em; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 820px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.25); }
    aside.open { transform: none; }
    .menu-btn { display: inline-grid; }
    .starters { grid-template-columns: 1fr; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; display: none; }
    .scrim.open { display: block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Menu">
    <div class="side-head">
      <button class="new-chat" id="newChat" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <div class="side-scroll">
      <div class="side-label">Browse topics</div>
      <nav id="topics" aria-label="Topics"></nav>
    </div>
    <div class="help" role="note">
      <strong>Need help now?</strong>
      Emergency <a href="tel:112">112</a> · Health line <a href="tel:114">114</a><br>
      Child helpline <a href="tel:116">116</a> · GBV <a href="tel:3512">3512</a><br>
      Isange One Stop Centre <a href="tel:3029">3029</a>
    </div>
    <div class="settings" role="group" aria-label="Display options">
      <button class="icon-btn" id="bigger" type="button" aria-label="Bigger text">A+</button>
      <button class="icon-btn" id="smaller" type="button" aria-label="Smaller text">A−</button>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark mode">◐ Theme</button>
      <button class="icon-btn" id="contrast" type="button" aria-pressed="false">High contrast</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <header>
      <button class="menu-btn" id="menu" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>Intyoza</h1>
      <span class="tag">Private · No names saved</span>
    </header>

    <div id="log" aria-live="polite" aria-relevant="additions">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer">
      <form class="box" id="form">
        <label for="q" class="sr-only">Your question</label>
        <textarea id="q" rows="1" maxlength="500" placeholder="Ask anything about your body, relationships or health…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="foot">Intyoza gives general health information and does not replace a health worker. We do not ask your name and do not save your questions.</div>
    </div>
  </main>
</div>

<script>
(() => {
  const API = new URLSearchParams(location.search).get("api") || "";
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), log = $("log"), q = $("q"), send = $("send");
  const TOPICS = {
    menstruation: ["🩸", "Periods"], puberty: ["🌱", "Growing up"], contraception: ["💊", "Contraception"],
    pregnancy: ["🤰", "Pregnancy"], stis: ["🔬", "STIs"], hiv: ["🎗️", "HIV"], relationships: ["💬", "Relationships"],
    consent_safety: ["🛡️", "Consent and safety"], wellbeing: ["💚", "Wellbeing"], services_rights: ["🏥", "Services and rights"],
  };
  const STARTERS = [
    ["Can I get pregnant the first time I have sex?", "Pregnancy"],
    ["Is it normal to have irregular periods?", "Periods"],
    ["Where can I get an HIV test in Rwanda?", "HIV"],
    ["How do I say no to sex if I am not ready?", "Relationships"],
  ];
  let busy = false;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function welcome() {
    thread.innerHTML = "";
    const w = el("section", "welcome");
    const logo = el("div", "avatar logo", "I");
    logo.setAttribute("aria-hidden", "true");
    w.append(logo, el("h2", null, "Hi, I'm Intyoza"),
      el("p", null, "Ask me anything about growing up, periods, relationships, consent, contraception, pregnancy, STIs or HIV. Nobody will judge you."));
    const g = el("div", "starters");
    for (const [text, tag] of STARTERS) {
      const b = el("button", "starter", text);
      b.type = "button";
      b.append(el("small", null, tag));
      b.onclick = () => ask(text);
      g.append(b);
    }
    w.append(g);
    thread.append(w);
  }

  function addUser(text) {
    thread.querySelector(".welcome")?.remove();
    const m = el("div", "msg user");
    m.append(el("div", "bubble", text));
    thread.append(m);
    scrollDown();
  }

  function addTyping() {
    const m = el("div", "msg bot");
    m.id = "typing";
    const a = el("div", "avatar", "I"); a.setAttribute("aria-hidden", "true");
    const d = el("div", "dots"); d.setAttribute("aria-label", "Intyoza is typing");
    d.append(el("span"), el("span"), el("span"));
    m.append(a, d);
    thread.append(m);
    scrollDown();
  }

  function addBot(r) {
    $("typing")?.remove();
    const m = el("div", "msg bot" + (r.type === "safe" || r.type === "refuse" ? " safe" : ""));
    const a = el("div", "avatar", "I"); a.setAttribute("aria-hidden", "true");
    const body = el("div", "body");
    if (r.type === "answer" && r.title) body.append(el("div", "title", r.title));
    body.append(el("div", "text", r.answer));

    if (r.suggestions && r.suggestions.length) {
      body.append(el("div", "chips-label", r.type === "answer" ? "Related questions" : "Did you mean"));
      const c = el("div", "chips");
      for (const s of r.suggestions) {
        const b = el("button", "chip", s); b.type = "button";
        b.onclick = () => ask(s, true);
        c.append(b);
      }
      body.append(c);
    }

    const meta = el("div", "meta");
    if (typeof r.confidence === "number") {
      const c = r.confidence;
      const badge = el("span", "acc " + (c >= 80 ? "high" : c >= 60 ? "mid" : "low"));
      badge.title = "Estimated accuracy: how often answers with this level of confidence were correct when we tested the model on questions it had never seen.";
      badge.setAttribute("aria-label", `Estimated accuracy ${c} percent`);
      const bar = el("span", "bar"); const fill = el("i"); fill.style.width = c + "%"; bar.append(fill);
      badge.append(el("span", null, `${c}% accuracy`), bar);
      meta.append(badge);
    }
    if (r.source) meta.append(el("span", null, "Source: " + r.source));
    const copy = el("button", null, "Copy"); copy.type = "button";
    copy.onclick = async () => { try { await navigator.clipboard.writeText(r.answer); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500); } catch {} };
    meta.append(copy);
    if ("speechSynthesis" in window) {
      const sp = el("button", null, "Read aloud"); sp.type = "button";
      sp.onclick = () => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.answer); u.lang = "en"; speechSynthesis.speak(u); };
      meta.append(sp);
    }
    body.append(meta);
    m.append(a, body);
    thread.append(m);
    scrollDown();
  }

  async function ask(text, isTitle = false) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    closeMenu();
    addUser(text);
    q.value = ""; grow();
    addTyping();
    const started = Date.now();
    let r;
    try {
      const res = await fetch(API + "/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(isTitle ? { title: text } : { message: text }),
      });
      r = await res.json();
      if (!res.ok) throw new Error(r.error || "error");
    } catch (e) {
      r = { type: "error", answer: "Sorry, I could not connect. Please check your connection and try again. If you need help now, call 114 (health) or 112 (emergency)." };
    }
    const wait = Math.max(0, 450 - (Date.now() - started));   // short pause so the reply feels natural
    setTimeout(() => { addBot(r); busy = false; send.disabled = !q.value.trim(); q.focus(); }, wait);
  }

  async function loadTopics() {
    try {
      const data = await (await fetch(API + "/api/topics")).json();
      const nav = $("topics");
      for (const [key, [icon, name]] of Object.entries(TOPICS)) {
        const titles = data[key];
        if (!titles || !titles.length) continue;
        const b = el("button", "topic"); b.type = "button"; b.setAttribute("aria-expanded", "false");
        b.append(el("span", null, icon), el("span", null, `${name}`));
        const list = el("div", "topic-qs");
        const pick = [...titles].sort(() => Math.random() - .5).slice(0, 8);
        for (const t of pick) {
          const x = el("button", null, t); x.type = "button";
          x.onclick = () => ask(t, true);
          list.append(x);
        }
        b.onclick = () => { const open = list.classList.toggle("open"); b.setAttribute("aria-expanded", String(open)); };
        nav.append(b, list);
      }
    } catch {}
  }

  function grow() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; }
  q.addEventListener("input", () => { grow(); send.disabled = busy || !q.value.trim(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(q.value); });
  $("newChat").onclick = () => { speechSynthesis?.cancel?.(); welcome(); closeMenu(); q.focus(); };

  // mobile menu
  const side = $("sidebar"), scrim = $("scrim"), menu = $("menu");
  function closeMenu() { side.classList.remove("open"); scrim.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); }
  menu.onclick = () => { side.classList.add("open"); scrim.classList.add("open"); menu.setAttribute("aria-expanded", "true"); };
  scrim.onclick = closeMenu;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

  // display settings (remembered on this device only)
  const root = document.documentElement;
  let fs = parseInt(store.get("intyoza-fs") || "16", 10);
  const applyFs = () => { root.style.setProperty("--fs", fs + "px"); store.set("intyoza-fs", fs); };
  $("bigger").onclick = () => { fs = Math.min(24, fs + 2); applyFs(); };
  $("smaller").onclick = () => { fs = Math.max(13, fs - 2); applyFs(); };
  const theme = store.get("intyoza-theme"); if (theme) root.dataset.theme = theme;
  $("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("intyoza-theme", root.dataset.theme);
  };
  $("contrast").onclick = (e) => {
    const on = root.dataset.contrast !== "high";
    if (on) root.dataset.contrast = "high"; else delete root.dataset.contrast;
    e.currentTarget.setAttribute("aria-pressed", String(on));
  };

  applyFs(); welcome(); loadTopics(); q.focus();
})();
</script>
</body>
</html>
